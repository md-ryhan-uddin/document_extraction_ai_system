services:
  # Django Web Application - uses existing vessel-scheduling-db
  - type: web
    name: doc-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: vessel-scheduling-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: DEFAULT_DPI
        value: "200"
      - key: HIGH_DPI
        value: "300"
      - key: LOW_CONFIDENCE_THRESHOLD
        value: "0.6"
      - key: MAX_FILE_SIZE
        value: "10485760"
      # Rate Limiting & Security
      - key: UPLOAD_RATE_PER_HOUR
        value: "10"
      - key: UPLOAD_DAILY_LIMIT
        value: "50"
      - key: MAX_CONCURRENT_PROCESSING
        value: "3"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: PROCESSING_TIMEOUT
        value: "600"
      - key: THROTTLE_WAIT_TIME
        value: "60"
    # Note: Persistent disks not available on free tier
    # Uploaded files will be lost on restart - use cloud storage (Cloudinary) for production
